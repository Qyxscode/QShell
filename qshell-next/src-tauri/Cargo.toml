[package]
name = "qshell"
version = "0.99.70"
description = "QShell"
authors = ["you"]
edition = "2024"

[[bin]]
name = "QShell"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：关闭 devUrl，改为内嵌 ../dist 前端资源
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
parking_lot = "0.12"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
notify-rust = "4"
reqwest = { version = "0.13.5", features = ["blocking"] }
regex = "1.13.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = "0.4"
serialport = "4.10.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
